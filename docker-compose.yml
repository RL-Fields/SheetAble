version: "3.8"

# Self-hosted SheetAble stack: Go/Gin backend (with the React frontend
# embedded into the binary at build time), a Postgres database, and the
# pdf2png thumbnail-generation microservice.
#
# Tags (and therefore instrument/category assignment) use a Postgres-only
# column type (text[]), so this deploys Postgres rather than SQLite/MySQL.
#
# Copy .env.example to .env and fill in real secrets before running:
#   docker compose up -d --build
#
# HOST_PORT defaults to 8081, NOT 8080 - deliberately different from the
# existing (unforked) SheetAble instance already running at
# 192.168.1.185:8080, so this can come up alongside it without touching
# anything about that instance (own containers, own named volumes below,
# since Compose prefixes volume/container names with this project's
# directory name).

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      - db
      - pdf2png
    environment:
      DB_DRIVER: postgres
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-sheetable}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-sheetable}
      API_SECRET: ${API_SECRET:?set API_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@admin.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      SERVER_URL: ${SERVER_URL:-http://localhost:8081}
      CONFIG_PATH: /app/config
      PORT: "8080"
      # This is the fix for thumbnails not loading: point it at OUR OWN
      # pdf2png container below, not the upstream SaaS instance.
      PDF2PNG_URL: http://pdf2png:5000/createthumbnail
    volumes:
      - sheetable-data:/app/config
    ports:
      # Host side is 8081 by default - see the note at the top of this file.
      - "${HOST_PORT:-8081}:8080"

  pdf2png:
    build:
      context: ./pdf2png
    restart: unless-stopped
    # No published port needed - only "backend" talks to this, over the
    # Docker network.

  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-sheetable}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-sheetable}
    volumes:
      - sheetable-db:/var/lib/postgresql/data

volumes:
  sheetable-data:
  sheetable-db:
